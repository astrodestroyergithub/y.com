<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Deep Obsidian Core Background -->
    <radialGradient id="obsidianBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="65%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Outer Squircle Rim Gradient (Cyan -> Violet -> Emerald) -->
    <linearGradient id="rimGrad" x1="8" y1="8" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Left Wing Gradient (Electric Cyan to Pure White) -->
    <linearGradient id="leftWing" x1="28" y1="28" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Right Wing Gradient (Solarpunk Emerald to Pure White) -->
    <linearGradient id="rightWing" x1="100" y1="28" x2="64" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Central Stem Gradient (White Nexus to Cyan-Emerald Base) -->
    <linearGradient id="stemGrad" x1="64" y1="64" x2="64" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Planetary Horizon Ring Gradient -->
    <linearGradient id="orbitGrad" x1="18" y1="64" x2="110" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Cyan-Emerald Glow Filter -->
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle App Badge Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#obsidianBg)" stroke="url(#rimGrad)" stroke-width="3.5"/>

  <!-- Subtle Inner Glass Highlight -->
  <rect x="11" y="11" width="106" height="106" rx="24" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Global Town Square Orbital Ring -->
  <ellipse cx="64" cy="66" rx="44" ry="16" transform="rotate(-16 64 66)" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- Iconic Geometric 'Y' Monogram -->
  <g filter="url(#nexusGlow)">
    <!-- Vertical Pillar (Unified Citizen Voice) -->
    <path d="M64 65 L64 100" stroke="url(#stemGrad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Left Convergence Arm (Perspective A) -->
    <path d="M31 32 L64 65" stroke="url(#leftWing)" stroke-width="14" stroke-linecap="round"/>

    <!-- Right Convergence Arm (Perspective B) -->
    <path d="M97 32 L64 65" stroke="url(#rightWing)" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Central Consensus Nexus Spark (Unbiased Truth Core) -->
  <circle cx="64" cy="65" r="8.5" fill="#05080f"/>
  <circle cx="64" cy="65" r="5.5" fill="#22d3ee"/>
  <circle cx="64" cy="65" r="2.5" fill="#ffffff"/>

  <!-- Nimbak AI North Star Sparkle -->
  <path d="M64 17 L66 23 L72 25 L66 27 L64 33 L62 27 L56 25 L62 23 Z" fill="#a78bfa"/>
</svg>